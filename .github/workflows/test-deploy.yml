# Verifies that the site still builds on every pull request targeting main.
# Nothing is deployed. Make this check required in branch protection so that
# broken links or invalid Markdown cannot be merged (see SETUP.md).
name: Test build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: test-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build site
        run: npm run build
