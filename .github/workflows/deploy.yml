# Builds the Docusaurus site and publishes it to GitHub Pages.
#
# Requires, once, in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# See SETUP.md for the full checklist.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

# The minimum token permissions needed to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once. A push that arrives while a deployment
# is running waits for it instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build site
        run: npm run build

      - name: Upload build output as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
